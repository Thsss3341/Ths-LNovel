name: Linovelib Search Index

# Rebuilds the novel list the linovelib_tw plugin searches (see
# scripts/linovelib-index.js) and publishes it to the `index` branch.
on:
  schedule:
    # Daily at 03:23 Hong Kong time.
    - cron: '23 19 * * *'
  workflow_dispatch:
  # Pull requests only build the index, to check that the sites can be read.
  pull_request:
    paths:
      - 'scripts/linovelib-index.js'
      - '.github/workflows/linovelib-index.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Build Search Index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Build Index
        run: node scripts/linovelib-index.js .index/linovelib_tw.json

      - name: Publish Index
        if: github.event_name != 'pull_request'
        working-directory: .index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b index
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add linovelib_tw.json
          git commit -qm "Update linovelib search index"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index
